version: 1

terminal_base: &terminal_base
  content_type: log
  width: 100
  font_size: 15
  title: Build Output
  line_numbers: false
  indent_guides: false

terminal_theme_base: &terminal_theme_base
  <<: *terminal_base
  input: inputs/windows.log
  frame: windows
  width: 64
  title: Theme Preview
  command_highlight: powershell

code_base: &code_base
  content_type: code
  width: 64
  font_size: 15
  frame: mac
  title: Source Preview
  syntax_theme: vscode-dark
  line_numbers: false
  indent_guides: false

code_lines_base: &code_lines_base
  <<: *code_base
  line_numbers: true
  line_number_style: vscode
  indent_guides: true

language_vscode_dark: &language_vscode_dark
  <<: *code_base
  width: 88
  syntax_theme: vscode-dark

language_vscode_light: &language_vscode_light
  <<: *code_base
  width: 88
  syntax_theme: vscode-light

language_intellij_dark: &language_intellij_dark
  <<: *code_base
  width: 88
  syntax_theme: intellij-dark

language_intellij_light: &language_intellij_light
  <<: *code_base
  width: 88
  syntax_theme: intellij-light

renders:
  project-python:
    <<: *code_lines_base
    input: inputs/example.py
    output: ../build/project-python.png
    width: 88
    language: python

  project-ansible:
    <<: *code_lines_base
    input: inputs/ansible-playbook.yml
    output: ../build/project-ansible.png
    width: 88
    language: yaml
    syntax_theme: vscode-light
    frame: ubuntu

  project-terminal:
    <<: *terminal_base
    input: inputs/sample.log
    output: ../build/project-terminal.png
    frame: ubuntu
    theme: ubuntu
    command_highlight: ubuntu

  frame-windows:
    <<: *terminal_base
    input: inputs/windows.log
    output: frames/sample-windows.png
    frame: windows
    theme: powershell
    command_highlight: powershell

  frame-macos:
    <<: *terminal_base
    input: inputs/macos.log
    output: frames/sample-macos.png
    frame: mac
    theme: macos

  frame-ubuntu:
    <<: *terminal_base
    input: inputs/ubuntu.log
    output: frames/sample-ubuntu.png
    frame: ubuntu
    theme: ubuntu
    command_highlight: ubuntu

  frame-frameless:
    <<: *terminal_base
    input: inputs/sample.log
    output: frames/sample-frameless.png
    frame: frameless
    theme: ubuntu
    command_highlight: ubuntu

  frame-frameless-tight:
    <<: *terminal_base
    input: inputs/sample.log
    output: frames/sample-frameless-tight.png
    frame: frameless
    theme: ubuntu
    width: 72
    margin: 0
    padding_x: 0
    padding_y: 0
    command_highlight: ubuntu

  frame-long-ubuntu:
    <<: *terminal_base
    input: inputs/long-ubuntu.log
    output: frames/sample-long-ubuntu.png
    frame: ubuntu
    theme: ubuntu
    width: 110
    command_highlight: ubuntu

  frame-sample:
    <<: *terminal_base
    input: inputs/sample.log
    output: frames/sample.png
    frame: windows
    theme: powershell
    command_highlight: ubuntu

  frame-python-code:
    <<: *code_base
    input: inputs/example.py
    output: frames/sample-python-code.png
    language: python

  frame-vagrantfile:
    <<: *code_base
    input: inputs/Vagrantfile
    output: frames/sample-vagrantfile.png
    language: ruby

  frame-ansible-playbook:
    <<: *code_base
    input: inputs/ansible-playbook.yml
    output: frames/sample-ansible-playbook.png
    width: 72
    frame: ubuntu
    language: yaml
    syntax_theme: vscode-light

  syntax-vscode-line-numbers:
    <<: *code_lines_base
    input: inputs/example.py
    output: syntax/syntax-vscode-line-numbers.png
    language: python

  syntax-idea-line-numbers:
    <<: *code_lines_base
    input: inputs/example.py
    output: syntax/syntax-idea-line-numbers.png
    language: python
    syntax_theme: intellij-dark
    line_number_style: idea
    indent_guides: false

  syntax-vscode-line-numbers-tight:
    <<: *code_lines_base
    input: inputs/example.py
    output: syntax/syntax-vscode-line-numbers-tight.png
    language: python
    frame: frameless
    width: 56
    margin: 0
    padding_x: 0
    padding_y: 0

  syntax-idea-line-numbers-tight:
